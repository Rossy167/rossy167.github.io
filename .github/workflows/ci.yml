name: CI

"on":
  push:
  pull_request:

jobs:
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate HTML
        run: npx --yes html-validate --config .htmlvalidate.json "*.html"

  link-check:
    name: Broken link check (best effort)
    runs-on: ubuntu-latest
    needs: html-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: >-
            --no-progress
            --accept 100..=103,200..=299,403
            --exclude-mail
            *.html
