name: CV PDF

"on":
  push:
    branches: [master]
    paths:
      - cv.md
      - build-cv-pdf.mjs
      - package.json
      - package-lock.json
      - .github/workflows/cv-pdf.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Regenerate Louis_Ross_CV.pdf from cv.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build CV PDF
        run: node build-cv-pdf.mjs

      - name: Commit regenerated PDF if changed
        run: |
          if git diff --quiet -- Louis_Ross_CV.pdf; then
            echo "Louis_Ross_CV.pdf unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Louis_Ross_CV.pdf
          git commit -m "Regenerate Louis_Ross_CV.pdf from cv.md [skip ci]"
          git push
